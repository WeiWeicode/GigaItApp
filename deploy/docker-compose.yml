# IT 管理系統部署到本機 Gateway(視同測試區):
#
#   sh deploy/gen-secrets.sh                                                          # 第一次:產生 secrets/(不入版控)
#   docker compose -f deploy/docker-compose.yml up -d --build --wait itapp-api        # 後端(Nginx /it/api/ → itapp-api:51291)
#   docker compose -f deploy/docker-compose.yml run --rm --build spa-it               # 前端:發佈到 gw_www 的 it-admin(取代範例 IT 頁面)
#   docker compose -f deploy/docker-compose.yml run --rm spa-it rollback it-admin     # 前端回滾到上一版
#
# 與 Gateway 同一台主機:加入 Gateway 的 Docker 網路。
#   /api/it/*:BFF 依路由表(deploy/gateway-routes.yaml)以容器名稱 itapp-api:51291 轉入,本服務以 BFF JWKS 驗證內部 Token
#   /it/api/*:過渡期保留的自有登入 API(Nginx ITAPP_API_UPSTREAM 直通),前端已改 Gateway 單一入口,測試區驗收後移除
name: giganexus-itapp

services:
  itapp-api:
    image: giganexus/itapp-api:${IMAGE_TAG:-dev}
    build:
      context: ../backend
      secrets: [npm_token]
    restart: unless-stopped
    environment:
      IT_ENV: ${IT_ENV:-test}
      PORT: "51291"
      DATA_DIR: /app/data
      ITAPP_JWT_SECRET_FILE: /run/secrets/itapp_jwt_secret
      ITAPP_SEED_PASSWORD_FILE: /run/secrets/itapp_seed_password
      # 經 Nginx 呼叫 BFF;本機 https://nginx + 開發用自簽憑證(NODE_EXTRA_CA_CERTS)
      # 公司測試區 / 正式區:Gateway DNS 名稱(Gateway compose 已設為 nginx 的網路別名),公司憑證為公開 CA 不需額外信任(Gateway PRD Q1)
      BFF_MODE: ${BFF_MODE:-live}
      BFF_BASE_URL: ${BFF_BASE_URL:-https://nginx}
      BFF_SERVICE_USER: ${BFF_SERVICE_USER:-S100001}
      BFF_SERVICE_PASSWORD_FILE: /run/secrets/bff_service_password
      NODE_EXTRA_CA_CERTS: /run/gw-ca.crt
      # 經 Gateway 轉入的 /api/it/*:內部 Token 的 aud 與 BFF JWKS(同一 Docker 網路直連 bff-1,不經 Nginx 的內網白名單)
      SERVICE_CODE: itapp-api
      GW_JWKS_URL: ${GW_JWKS_URL:-http://bff-1:3000/.well-known/jwks.json}
      # API 監控(giga-observe,Gateway BACKEND-GUIDE §11);Key 檔空白或未設定 MONITOR_URL 時停用
      MONITOR_URL: ${MONITOR_URL:-}
      MONITOR_API_KEY_FILE: /run/secrets/monitor_api_key
      RELEASE_SHA: ${RELEASE_SHA:-dev}
    secrets:
      - itapp_jwt_secret
      - itapp_seed_password
      - bff_service_password
      - monitor_api_key
    volumes:
      - itapp_data:/app/data
      - ${GW_CA_CERT:-../../giga-api-gateway-bff/deploy/dev/secrets/pki/ca.crt}:/run/gw-ca.crt:ro
    networks:
      gateway:
        aliases: [itapp-api]

  spa-it:
    image: giganexus/spa-it-admin:${IMAGE_TAG:-dev}
    build:
      context: ../frontend
      secrets: [npm_token]
      args:
        RELEASE_SHA: ${RELEASE_SHA:-dev}
    profiles: ["publish"]
    restart: "no"
    volumes:
      - gw_www:/srv/www
    command: ["publish", "it-admin"]

# 機密目錄:本機為 repo 的 secrets/(gen-secrets.sh 產生);測試區 / 正式區以 ITAPP_SECRETS_DIR 指向主機受保護目錄
secrets:
  itapp_jwt_secret:
    file: ${ITAPP_SECRETS_DIR:-../secrets}/itapp_jwt_secret
  itapp_seed_password:
    file: ${ITAPP_SECRETS_DIR:-../secrets}/itapp_seed_password
  bff_service_password:
    file: ${ITAPP_SECRETS_DIR:-../secrets}/bff_service_password
  monitor_api_key:
    file: ${ITAPP_SECRETS_DIR:-../secrets}/monitor_api_key
  # 建置用:GitLab npm Registry 讀取 Token(環境變數 GITLAB_NPM_TOKEN;CI 由主機機密檔讀入)
  npm_token:
    environment: GITLAB_NPM_TOKEN

volumes:
  itapp_data:
  gw_www:
    external: true
    name: ${GW_WWW_VOLUME:-giganexus-gw-dev_gw_www}

networks:
  gateway:
    external: true
    name: ${GW_NETWORK:-giganexus-gw-dev_default}
