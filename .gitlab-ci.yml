# GigaItApp Pipeline(Runner:主機 2 WSL shell executor,tag windows-runner;與 Gateway 同一台主機)
#   check        所有分支:後端型別檢查與測試、前端型別檢查
#   deploy-test  develop:在主機 2 建置並更新 itapp-api(加入 Gateway 網路),前端發佈到 Gateway 的 /it/
#   rbac-test    develop:以已部署的 Gateway 映像套用 deploy/gateway-rbac.yaml(it.* 選單權限、it-admin 角色)
# 主機需有:${ITAPP_ENV_FILE}(範本 deploy/test.env.example)、ITAPP_SECRETS_DIR 內的機密檔;
#           Gateway 已部署(giganexus-gw_default 網路、giganexus-gw_gw_www volume)
# @giganexus/backend-sdk、@giganexus/web-kit 取自公司 GitLab npm Registry:Token(群組 Deploy Token,read_package_registry)
#   放在主機機密檔 ${NPM_TOKEN_FILE}(擁有者 user、群組 gitlab-runner、440),以 GITLAB_NPM_TOKEN 提供給 npm 與 Docker 建置 secret
stages: [check, deploy-test, rbac-test]

variables:
  ITAPP_ENV_FILE: /srv/giganexus/deploy/itapp.env
  GATEWAY_DIR: /srv/giganexus/shared/giga-api-gateway-bff
  GW_TEST_ENV_FILE: /srv/giganexus/deploy/test.env
  NPM_TOKEN_FILE: /srv/giganexus/deploy/secrets/gitlab_npm_token

.runner: &runner
  tags: [windows-runner]

check:backend:
  <<: *runner
  stage: check
  script:
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - cd backend
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test

check:frontend:
  <<: *runner
  stage: check
  script:
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run typecheck

deploy-test:
  <<: *runner
  stage: deploy-test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment: { name: test, url: https://giganexus-test.gigasolar.com.tw/it/ }
  script:
    - test -f "$ITAPP_ENV_FILE" || { echo "缺少 $ITAPP_ENV_FILE" >&2; exit 1; }
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA RELEASE_SHA=$CI_COMMIT_SHORT_SHA COMPOSE_ENV_FILES="$ITAPP_ENV_FILE" GATEWAY_DIR
    # 建置 secret npm_token(compose secrets: environment)
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - IT="docker compose -f deploy/docker-compose.yml"
    # 1. 後端:建置並更新,等待 healthcheck(/healthz)
    # --pull:一律以官方基底映像建置;主機上的 node:22-alpine 可能被其他專案覆寫(NODE_ENV=production 導致 tsc 不存在,同 Gateway 2026-10-02)
    - $IT build --pull itapp-api
    - $IT up -d --wait itapp-api
    # 2. 前端:建置並發佈到 gw_www 的 it-admin(保留上一版供回滾)
    - $IT --profile publish build --pull spa-it
    - $IT run --rm spa-it
    # 3. 冒煙測試(經 Gateway Nginx)
    - curl -skf -o /dev/null https://127.0.0.1/it/ && echo "OK   /it/"
    - curl -sk -o /dev/null -w '%{http_code}\n' https://127.0.0.1/api/auth/me | grep -q 401 && echo "OK   /api/auth/me → 401(單一入口)"
    # itapp-api 的 /api/it/* 只接受經 Gateway 轉入的內部 Token:直接呼叫應回 401
    # 整行加引號:內含「: 」(三元運算子)會被 YAML 解析成 mapping 而使 Pipeline yaml invalid
    - '$IT exec -T itapp-api node -e "fetch(\"http://127.0.0.1:51291/api/it/dashboard/overview\").then((r) => process.exit(r.status === 401 ? 0 : 1))" && echo "OK   itapp-api /api/it/* 無內部 Token → 401"'

rbac-test:
  <<: *runner
  stage: rbac-test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # 與測試區 Gateway 相同的映像(Gateway deploy-test 記錄);GATEWAY_DIR 為 Gateway 共用目錄(含 deploy/)
    - export IMAGE_TAG="$(cat "$(dirname "$GATEWAY_DIR")/gateway-image-tag")" REGISTRY=10.10.130.123:5050/giganexus/giga-api-gateway-bff
    - sh deploy/apply-gateway-rbac.sh test "$GW_TEST_ENV_FILE"
